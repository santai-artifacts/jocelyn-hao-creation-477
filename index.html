<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadway NYC – Shows & Theater Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0b13;
      --surface:   #12121e;
      --surface2:  #191928;
      --border:    rgba(255,255,255,0.07);
      --gold:      #D4AF37;
      --gold-lt:   #F0D060;
      --text:      #ddddf0;
      --muted:     #686888;
      --sidebar:   360px;
    }

    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 58px; z-index: 1000;
      background: linear-gradient(105deg, #130228 0%, #27091c 55%, #140505 100%);
      border-bottom: 1px solid rgba(212,175,55,0.18);
      display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { font-size: 26px; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--gold-lt); letter-spacing: -0.01em; }
    .logo-text span { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 300; font-style: normal; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
    .header-note {
      font-size: 11px; color: var(--muted);
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 4px 14px;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; padding-top: 58px; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .sb-top { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

    .count-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px; }

    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-wrap input {
      width: 100%; padding: 9px 10px 9px 32px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: rgba(212,175,55,0.35); }
    .search-wrap input::placeholder { color: var(--muted); }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .chip:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }
    .chip.on { background: var(--gold); border-color: var(--gold); color: #0b0b13; font-weight: 600; }

    .list-scroll { flex: 1; overflow-y: auto; padding: 10px; }
    .list-scroll::-webkit-scrollbar { width: 3px; }
    .list-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ── Card ── */
    .card {
      position: relative; overflow: hidden;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 14px 11px; margin-bottom: 8px; cursor: pointer;
      transition: border-color 0.2s, transform 0.18s, background 0.2s;
    }
    .card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--cc); border-radius: 3px 0 0 3px;
    }
    .card:hover { border-color: rgba(255,255,255,0.13); transform: translateX(2px); }
    .card.active { border-color: var(--cc); background: rgba(255,255,255,0.03); }

    .card-row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; line-height: 1.2; }
    .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
      background: var(--cc); color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .card-venue { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .card-desc {
      font-size: 12px; color: var(--muted); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 8px;
    }
    .card-foot { font-size: 11px; color: var(--muted); }

    .no-results { text-align: center; padding: 52px 16px; color: var(--muted); }
    .no-results .nr-icon { font-size: 34px; margin-bottom: 10px; }
    .no-results .nr-msg { font-size: 13px; }

    .sb-foot {
      padding: 8px 14px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--muted); text-align: center; flex-shrink: 0;
    }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Leaflet overrides ── */
    .leaflet-popup-content-wrapper {
      background: #141421 !important; border-radius: 12px !important;
      border: 1px solid rgba(212,175,55,0.22) !important;
      box-shadow: 0 16px 48px rgba(0,0,0,0.75) !important;
      color: var(--text) !important;
    }
    .leaflet-popup-tip { background: #141421 !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; font-size: 16px !important; top: 8px !important; right: 8px !important; }
    .leaflet-popup-content { margin: 14px 16px !important; }

    .pop-genre { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
    .pop-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; color: var(--gold-lt); line-height: 1.15; margin-bottom: 4px; }
    .pop-venue { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .pop-addr { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .pop-desc { font-size: 13px; color: #b0b0cc; line-height: 1.55; margin-bottom: 10px; max-width: 260px; }
    .pop-sched { font-size: 12px; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.07); padding-top: 9px; }

    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .app { flex-direction: column; height: auto; }
      .sidebar { width: 100%; max-height: 56vh; }
      #map { flex: none; height: 44vh; min-height: 280px; }
      .header-note { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark">🎭</span>
    <div class="logo-text">Broadway NYC <span>Theater Map</span></div>
  </div>
  <div class="header-note">Sample data · Verify at broadwayworld.com</div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-top">
      <div class="count-label" id="count-label">Broadway Shows</div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="search" type="search" placeholder="Search shows or theaters…">
      </div>
      <div class="chips">
        <button class="chip on" data-g="All">All</button>
        <button class="chip" data-g="Musical">Musical</button>
        <button class="chip" data-g="Play">Play</button>
        <button class="chip" data-g="Family">Family</button>
      </div>
    </div>
    <div class="list-scroll" id="list"></div>
    <div class="sb-foot">⚡ Illustrative sample · Always verify current showtimes</div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SHOWS = [
  {
    id: 1, title: "Hamilton",
    venue: "Richard Rodgers Theatre", address: "226 W 46th St, New York, NY",
    genre: "Musical",
    desc: "The story of America's Founding Father Alexander Hamilton—told through hip-hop, jazz, blues, and R&B. The show that changed Broadway.",
    sched: "Tue–Sun · Matinees Wed & Sat",
    color: "#4A90D9", lat: 40.7598, lng: -73.9853
  },
  {
    id: 2, title: "The Lion King",
    venue: "Minskoff Theatre", address: "200 W 45th St, New York, NY",
    genre: "Family",
    desc: "Disney's beloved tale of Simba brought alive with breathtaking puppetry, costumes, and an iconic score. A family favorite for decades.",
    sched: "Tue–Sun · Matinees Wed, Sat & Sun",
    color: "#F0882A", lat: 40.7585, lng: -73.9865
  },
  {
    id: 3, title: "Hadestown",
    venue: "Walter Kerr Theatre", address: "219 W 48th St, New York, NY",
    genre: "Musical",
    desc: "Two intertwining love stories—Orpheus & Eurydice, Hades & Persephone—set to electrifying folk-jazz. Eight-time Tony Award winner.",
    sched: "Tue–Sun · Matinees Wed & Sat",
    color: "#C8952A", lat: 40.7608, lng: -73.9869
  },
  {
    id: 4, title: "Moulin Rouge!",
    venue: "Al Hirschfeld Theatre", address: "302 W 45th St, New York, NY",
    genre: "Musical",
    desc: "A dazzling celebration of truth, beauty, freedom, and love in turn-of-the-century Paris. A pop-song spectacular like no other.",
    sched: "Tue–Sun · Matinees Wed & Sat",
    color: "#E04070", lat: 40.7588, lng: -73.9882
  },
  {
    id: 5, title: "Chicago",
    venue: "Ambassador Theatre", address: "219 W 49th St, New York, NY",
    genre: "Musical",
    desc: "The longest-running American musical in Broadway history. Jazz Age glam, murder, and acquittal in the Windy City—still electric after decades.",
    sched: "Tue–Sun · Matinees Wed, Sat & Sun",
    color: "#9898C0", lat: 40.7613, lng: -73.9867
  },
  {
    id: 6, title: "Aladdin",
    venue: "New Amsterdam Theatre", address: "214 W 42nd St, New York, NY",
    genre: "Family",
    desc: "A whole new world of magic, spectacle, and showstopping song. Disney's animated classic reimagined with Broadway dazzle.",
    sched: "Tue–Sun · Matinees Wed, Sat & Sun",
    color: "#28A8D8", lat: 40.7560, lng: -73.9879
  },
  {
    id: 7, title: "Wicked",
    venue: "Gershwin Theatre", address: "222 W 51st St, New York, NY",
    genre: "Musical",
    desc: "The untold story of the witches of Oz—the unlikely friendship between Glinda and Elphaba—long before Dorothy ever arrived.",
    sched: "Wed–Mon · Matinees Sat & Sun",
    color: "#44B860", lat: 40.7629, lng: -73.9840
  },
  {
    id: 8, title: "Into the Woods",
    venue: "St. James Theatre", address: "246 W 44th St, New York, NY",
    genre: "Musical",
    desc: "Sondheim's beloved fairy-tale mashup: Cinderella, Jack, Rapunzel, and more collide in a darkly funny meditation on wishes and consequences.",
    sched: "Wed–Mon · Matinees Wed & Sat",
    color: "#7B68EE", lat: 40.7583, lng: -73.9884
  },
  {
    id: 9, title: "Sweeney Todd",
    venue: "Lunt-Fontanne Theatre", address: "205 W 46th St, New York, NY",
    genre: "Musical",
    desc: "Sondheim's razor-sharp thriller about obsession and revenge. The demon barber of Fleet Street in a gripping, intimate revival.",
    sched: "Tue–Sun · Matinees Wed & Sat",
    color: "#C84848", lat: 40.7597, lng: -73.9865
  },
  {
    id: 10, title: "Appropriate",
    venue: "Hayes Theater", address: "240 W 44th St, New York, NY",
    genre: "Play",
    desc: "A riveting family drama confronting a dark Southern legacy unearthed after a patriarch's death. Tony Award winner for Best Play.",
    sched: "Thu–Mon · Matinees Sat & Sun",
    color: "#D4A050", lat: 40.7583, lng: -73.9875
  },
  {
    id: 11, title: "Stereophonic",
    venue: "Lyceum Theatre", address: "149 W 45th St, New York, NY",
    genre: "Play",
    desc: "A sweeping play about a rock band recording an album in the 1970s—ambition, creativity, and the corrosive price of fame.",
    sched: "Wed–Mon · Matinees Sat & Sun",
    color: "#B060D0", lat: 40.7581, lng: -73.9849
  },
  {
    id: 12, title: "The Notebook",
    venue: "Schoenfeld Theatre", address: "236 W 45th St, New York, NY",
    genre: "Musical",
    desc: "Nicholas Sparks' timeless love story on stage, following Noah and Allie across the decades with a sweeping Americana-folk score.",
    sched: "Tue–Sun · Matinees Wed & Sat",
    color: "#4898D8", lat: 40.7587, lng: -73.9870
  },
];

// ── State ──────────────────────────────────────────────
let activeId = null;
let activeGenre = 'All';
let searchQ = '';
const markers = {};

// ── Map setup ─────────────────────────────────────────
const map = L.map('map', {
  center: [40.7592, -73.9865],
  zoom: 15,
  zoomControl: false,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 20
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── Marker factory ────────────────────────────────────
function mkIcon(show, active) {
  const sz = active ? 44 : 36;
  const ring = active
    ? `0 0 0 5px ${show.color}44, 0 3px 14px rgba(0,0,0,0.65)`
    : '0 2px 10px rgba(0,0,0,0.55)';
  const border = active ? '2.5px solid rgba(255,255,255,0.9)' : '2px solid rgba(255,255,255,0.32)';
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${sz}px;height:${sz}px;border-radius:50%;
      background:${show.color};border:${border};
      box-shadow:${ring};
      display:flex;align-items:center;justify-content:center;
      font-size:${active ? 20 : 17}px;
      transition:all 0.25s;
    ">🎭</div>`,
    iconSize: [sz, sz],
    iconAnchor: [sz/2, sz/2],
    popupAnchor: [0, -(sz/2 + 4)]
  });
}

// ── Popup HTML ────────────────────────────────────────
function popupHTML(s) {
  return `<div>
    <div class="pop-genre" style="color:${s.color}">${s.genre}</div>
    <div class="pop-title">${s.title}</div>
    <div class="pop-venue">📍 ${s.venue}</div>
    <div class="pop-addr">${s.address}</div>
    <div class="pop-desc">${s.desc}</div>
    <div class="pop-sched">🕐 ${s.sched}</div>
  </div>`;
}

// ── Add markers ───────────────────────────────────────
SHOWS.forEach(s => {
  const m = L.marker([s.lat, s.lng], { icon: mkIcon(s, false) })
    .addTo(map)
    .bindPopup(popupHTML(s), { maxWidth: 300, className: '' });

  m.on('click', () => selectShow(s.id, false));
  m.on('popupopen', () => {
    // highlight card without flying again
    activeId = s.id;
    syncCards();
  });
  markers[s.id] = m;
});

// ── Select a show ─────────────────────────────────────
function selectShow(id, fromCard = true) {
  const prev = activeId;
  activeId = id;

  // refresh marker icons
  if (prev && markers[prev]) {
    const ps = SHOWS.find(x => x.id === prev);
    if (ps) markers[prev].setIcon(mkIcon(ps, false));
  }
  const s = SHOWS.find(x => x.id === id);
  if (markers[id]) markers[id].setIcon(mkIcon(s, true));

  if (fromCard) {
    map.flyTo([s.lat, s.lng], 16, { duration: 0.9 });
    setTimeout(() => {
      if (markers[id] && map.hasLayer(markers[id])) markers[id].openPopup();
    }, 750);
  }

  syncCards();
}

function syncCards() {
  document.querySelectorAll('.card').forEach(el => {
    el.classList.toggle('active', +el.dataset.id === activeId);
  });
  const active = document.querySelector(`.card[data-id="${activeId}"]`);
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Filter + render list ──────────────────────────────
function visible() {
  const q = searchQ.toLowerCase();
  return SHOWS.filter(s => {
    const gOk = activeGenre === 'All' || s.genre === activeGenre;
    const qOk = !q || s.title.toLowerCase().includes(q) || s.venue.toLowerCase().includes(q);
    return gOk && qOk;
  });
}

function renderList() {
  const shows = visible();
  const listEl = document.getElementById('list');
  const label = document.getElementById('count-label');

  label.textContent = shows.length === SHOWS.length
    ? `${SHOWS.length} Shows on Broadway`
    : `${shows.length} of ${SHOWS.length} Shows`;

  if (!shows.length) {
    listEl.innerHTML = `<div class="no-results">
      <div class="nr-icon">🎭</div>
      <div class="nr-msg">No shows match your search.</div>
    </div>`;
  } else {
    listEl.innerHTML = shows.map(s => `
      <div class="card ${activeId === s.id ? 'active' : ''}" data-id="${s.id}" style="--cc:${s.color}">
        <div class="card-row1">
          <div class="card-title">${s.title}</div>
          <div class="badge" style="background:${s.color}">${s.genre}</div>
        </div>
        <div class="card-venue">📍 ${s.venue} &middot; ${s.address.split(',')[0]}</div>
        <div class="card-desc">${s.desc}</div>
        <div class="card-foot">🕐 ${s.sched}</div>
      </div>
    `).join('');

    listEl.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => selectShow(+el.dataset.id, true));
    });
  }

  // sync marker visibility
  SHOWS.forEach(s => {
    const show = shows.some(x => x.id === s.id);
    if (show && !map.hasLayer(markers[s.id])) markers[s.id].addTo(map);
    if (!show && map.hasLayer(markers[s.id])) map.removeLayer(markers[s.id]);
  });
}

// ── Listeners ─────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value;
  renderList();
});

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    activeGenre = btn.dataset.g;
    renderList();
  });
});

// ── Boot ──────────────────────────────────────────────
renderList();
</script>
</body>
</html>
